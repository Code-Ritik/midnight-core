<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScaleX</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <nav>
            <div class="logo">
                <img src="./scalex_logo.png" alt="">
            </div>
            <div class="nav-button">
                <a href="#">Home</a>
                <a href="#">About us</a>
                <a href="#">Blog</a>
                <a href="#">Contact us</a>
            </div>
            <div class="get-start">
                <button>Get Started</button>
            </div>
        </nav>
    </header>
    <main>
        <div class="top-text">
            <div class="heading">
                <h1>Insights & Blogs</h1>
            </div>
            <div class="btn">
                <button>All</button>
                <button>Tech</button>
                <button>SaaS</button>
                <button>Marketing</button>
            </div>
        </div>
        <div class="bottom-card">
            <div class="card">
                <img src="./glass_image.png" alt="glassImg">
                <div class="text">
                    <button class="card-btn">Tech</button>
                    <h4>The Ultimate Guide To SaaS Marketing</h4>
                    <p><time datetime="2025-05-23">May 23, 2025</time></p>
                </div>
                
            </div>
            
            <div class="card">
                <img src="./chair_image.png" alt="chairImg">
                <div class="text">
                    <button class="card-btn">SaaS</button>
                    <h4>5 Key Trends In SaaS Growth For 2025</h4>
                    <p><time datetime="2025-05-23">May 23, 2025</time></p>
                </div>
            </div>
            
            <div class="card">
                <img src="./cat_image.png" alt="catImg">
                <div class="text">
                    <button class="card-btn">Marketing</button>
                    <h4>How Data-Driven Strategied Aare Improtant</h4>
                    <p><time datetime="2025-05-23">May 23, 2025</time></p>
                </div>
            </div>
        </div>
    </main>
</body>

</html>
